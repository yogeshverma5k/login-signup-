name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main  # Agar aapki main branch ka naam master hai, to yahan master likhein

# GitHub Actions ko Pages par deploy karne ki permission dena
permissions:
  contents: read
  pages: write
  id-token: write

# Agar pehle se koi build chal rahi hai toh use cancel karke naya shuru karein
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-base-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

