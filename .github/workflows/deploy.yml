name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main  # Agar aapki main branch ka naam master hai, to yahan master likhein

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Yahan node-version kar diya hai aur latest Node 22 select kiya hai

      - name: Install Dependencies
        run: npm install  # Yahan npm ci ki jagah npm install kar diya hai taaki bina lock file ke bhi kaam chal jaye

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
